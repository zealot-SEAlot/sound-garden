<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Garden</title>
<style>
  :root { --ink: #e8f0ff; --dim: #8f98bd; --panel: rgba(18, 22, 46, 0.72); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e1f; color: var(--ink);
    font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  .hud { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
    padding: 10px 14px; width: max-content; max-width: calc(100vw - 32px); font-size: 13px;
    background: var(--panel); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    backdrop-filter: blur(8px); user-select: none; }
  button, select { font: inherit; color: var(--ink); background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  select option { background: #1a1d38; }
  button:hover, select:hover { background: rgba(255,255,255,0.16); }
  label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
  input[type=range] { width: 90px; accent-color: #9fd8ff; }
  output { min-width: 2.2em; color: var(--ink); }
  .instruments { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .inst { display: flex; align-items: center; gap: 6px; }
  .inst .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .inst[aria-pressed="true"] { background: rgba(255,255,255,0.2); border-color: var(--c); }
  .hint { position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%); width: min(90vw, 460px);
    text-align: center; color: var(--dim); pointer-events: none; transition: opacity 0.8s; line-height: 1.6; }
  .hint h1 { margin: 0 0 6px; font-weight: 600; font-size: 30px; color: var(--ink); letter-spacing: 0.03em; }
  .hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="garden"></canvas>

<div class="hint" id="hint">
  <h1>Sound Garden</h1>
  <p id="hintText">Pick an instrument below (or press 1–4), then click to plant it.<br>
  Higher flowers sing higher notes, and the moonbeam plays your garden on a loop.<br>
  Drag to move &middot; drag off-screen or right-click to pull one up.</p>
</div>

<div class="hud">
  <div class="instruments" id="instruments" role="group" aria-label="Instrument"></div>
  <button id="play" title="Space">⏸ Pause</button>
  <label>Loop <input id="loop" type="range" min="4" max="16" step="1" value="8"><output id="loopOut">8s</output></label>
  <label>Scale <select id="scale"></select></label>
  <button id="surprise">✨ Surprise</button>
  <button id="clear">Clear</button>
</div>

<script>
const SCALES = {
  'Major pentatonic': [0, 2, 4, 7, 9],
  'Minor pentatonic': [0, 3, 5, 7, 10],
  'Dreamy lydian': [0, 2, 4, 6, 7, 9, 11],
  'Japanese in': [0, 1, 5, 7, 8],
};
const BASE_MIDI = 48;          // C3
const OCTAVES = 3;
const FLOWER_RADIUS = 14;
const MAX_FLOWERS = 120;
const EDGE_MARGIN = 16;        // px from the window edge that counts as "off-screen"
const SURPRISE_COUNT = 9;
const STORAGE_KEY = 'sound-garden-v1';
const TAU = Math.PI * 2;

/* ---------- instruments ---------- */
function envelope(ac, dest, t, { attack, peak, decay }) {
  const gain = ac.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(peak, t + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  gain.connect(dest);
  return gain;
}

function tone(ac, dest, { type, freq, start, stop, level = 1 }) {
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = level;
  osc.connect(gain).connect(dest);
  osc.start(start);
  osc.stop(stop);
  return osc;
}

// Each colour is its own instrument; petal count differs too so flowers are distinguishable without colour.
const INSTRUMENTS = {
  bell: {
    label: 'Bell', hue: 48, petals: 5,
    play(ac, out, freq, t) {
      const env = envelope(ac, out, t, { attack: 0.005, peak: 0.18, decay: 2.2 });
      [[1, 1], [2.76, 0.35], [5.4, 0.12]].forEach(([mult, level]) =>
        tone(ac, env, { type: 'sine', freq: freq * mult, start: t, stop: t + 2.3, level }));
    },
  },
  marimba: {
    label: 'Marimba', hue: 345, petals: 6,
    play(ac, out, freq, t) {
      const body = envelope(ac, out, t, { attack: 0.003, peak: 0.3, decay: 0.55 });
      tone(ac, body, { type: 'sine', freq, start: t, stop: t + 0.6 });
      const knock = envelope(ac, out, t, { attack: 0.002, peak: 0.08, decay: 0.08 });
      tone(ac, knock, { type: 'sine', freq: freq * 4, start: t, stop: t + 0.1 });
    },
  },
  harp: {
    label: 'Harp', hue: 172, petals: 7,
    play(ac, out, freq, t) {
      const env = envelope(ac, out, t, { attack: 0.004, peak: 0.12, decay: 1.2 });
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.Q.value = 2;
      filter.frequency.setValueAtTime(freq * 8, t);
      filter.frequency.exponentialRampToValueAtTime(freq * 1.2, t + 0.8);
      filter.connect(env);
      tone(ac, filter, { type: 'sawtooth', freq, start: t, stop: t + 1.3 });
    },
  },
  flute: {
    label: 'Flute', hue: 265, petals: 8,
    play(ac, out, freq, t) {
      const env = envelope(ac, out, t, { attack: 0.12, peak: 0.16, decay: 1.4 });
      const osc = tone(ac, env, { type: 'triangle', freq, start: t, stop: t + 1.6 });
      const vibrato = ac.createOscillator();
      const depth = ac.createGain();
      vibrato.frequency.value = 5;
      depth.gain.value = freq * 0.006;
      vibrato.connect(depth).connect(osc.frequency);
      vibrato.start(t);
      vibrato.stop(t + 1.6);
    },
  },
};
const INSTRUMENT_NAMES = Object.keys(INSTRUMENTS);
const DEFAULT_INSTRUMENT = INSTRUMENT_NAMES[0];

const canvas = document.getElementById('garden');
const ctx = canvas.getContext('2d');
const hintEl = document.getElementById('hint');

let W = 0, H = 0;
let flowers = [];
let sparkles = [];
let scaleName = Object.keys(SCALES)[0];
let currentInstrument = DEFAULT_INSTRUMENT;
let loopSeconds = 8;
let phase = 0;
let running = true;
let drag = null;
let audio = null;

const stars = Array.from({ length: 140 }, () => ({
  x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + 0.2, tw: Math.random() * TAU,
}));

/* ---------- layout ---------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rowCount = () => SCALES[scaleName].length * OCTAVES;
const snapY = (yFrac) => (clamp(Math.floor(yFrac * rowCount()), 0, rowCount() - 1) + 0.5) / rowCount();
const hueOf = (f) => INSTRUMENTS[f.instrument].hue;
const randomInstrument = () => INSTRUMENT_NAMES[Math.floor(Math.random() * INSTRUMENT_NAMES.length)];

/* ---------- audio ---------- */
function ensureAudio() {
  if (!audio) {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const master = ac.createGain();
    master.gain.value = 0.5;
    const delay = ac.createDelay(1);
    delay.delayTime.value = 0.33;
    const feedback = ac.createGain();
    feedback.gain.value = 0.35;
    const wet = ac.createGain();
    wet.gain.value = 0.3;
    master.connect(ac.destination);
    master.connect(delay);
    delay.connect(feedback).connect(delay);
    delay.connect(wet).connect(ac.destination);
    audio = { ac, master };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}

function midiFor(yFrac) {
  const steps = SCALES[scaleName];
  const idx = clamp(Math.floor((1 - yFrac) * rowCount()), 0, rowCount() - 1);
  return BASE_MIDI + 12 * Math.floor(idx / steps.length) + steps[idx % steps.length];
}

function playNote(f) {
  if (!audio) return;   // browsers only allow sound after the first click
  const { ac, master } = audio;
  const panner = ac.createStereoPanner();
  panner.pan.value = clamp(f.x * 2 - 1, -1, 1);
  panner.connect(master);
  const freq = 440 * 2 ** ((midiFor(f.y) - 69) / 12);
  INSTRUMENTS[f.instrument].play(ac, panner, freq, ac.currentTime);
}

/* ---------- garden state ---------- */
function makeFlower(x, y, instrument = currentInstrument) {
  return { x, y, instrument, petals: INSTRUMENTS[instrument].petals, glow: 0, spin: Math.random() * TAU, leaving: false };
}

function burst(f, count, fall = false) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU;
    const s = 20 + Math.random() * 60;
    sparkles.push({
      x: f.x * W, y: f.y * H, vx: Math.cos(a) * s, vy: Math.sin(a) * s + (fall ? 40 : -30),
      life: 1, hue: hueOf(f),
    });
  }
}

function trigger(f) {
  f.glow = 1;
  burst(f, 6);
  playNote(f);
}

function removeFlower(f) {
  burst(f, 14, true);
  flowers = flowers.filter((other) => other !== f);
}

function flowerAt(px, py) {
  for (let i = flowers.length - 1; i >= 0; i--) {
    const f = flowers[i];
    if (Math.hypot(f.x * W - px, f.y * H - py) < FLOWER_RADIUS * 1.8) return f;
  }
  return null;
}

function save() {
  try {
    const data = {
      scaleName, loopSeconds, instrument: currentInstrument,
      flowers: flowers.map(({ x, y, instrument }) => ({ x, y, instrument })),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch { /* storage unavailable (private window) — garden just won't persist */ }
}

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!data) return;
    const validInstrument = (name) => (INSTRUMENTS[name] ? name : DEFAULT_INSTRUMENT);
    if (SCALES[data.scaleName]) scaleName = data.scaleName;
    if (Number.isFinite(data.loopSeconds)) loopSeconds = clamp(data.loopSeconds, 4, 16);
    currentInstrument = validInstrument(data.instrument);
    if (Array.isArray(data.flowers)) {
      flowers = data.flowers
        .filter((f) => Number.isFinite(f.x) && Number.isFinite(f.y))
        .slice(0, MAX_FLOWERS)
        .map((f) => makeFlower(clamp(f.x, 0, 1), clamp(f.y, 0, 1), validInstrument(f.instrument)));
    }
  } catch { /* corrupt or blocked storage — start fresh */ }
}

function hideHint() { hintEl.classList.add('gone'); }

/* ---------- simulation ---------- */
function advance(dt) {
  const prev = phase;
  phase = (phase + dt / loopSeconds) % 1;
  const wrapped = phase < prev;
  for (const f of flowers) {
    if (drag && drag.flower === f) continue;
    const crossed = wrapped ? (f.x > prev || f.x <= phase) : (f.x > prev && f.x <= phase);
    if (crossed) trigger(f);
  }
}

function update(dt) {
  for (const f of flowers) {
    f.glow *= Math.exp(-dt * 3);
    f.spin += dt * (0.15 + f.glow);
  }
  sparkles = sparkles
    .map((s) => ({ ...s, x: s.x + s.vx * dt, y: s.y + s.vy * dt, vy: s.vy + 30 * dt, life: s.life - dt * 1.2 }))
    .filter((s) => s.life > 0);
}

/* ---------- drawing ---------- */
function drawSky(time) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#060818');
  g.addColorStop(1, '#1b1542');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.3 * Math.sin(time * 0.001 + s.tw)})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(160,180,255,0.045)';
  ctx.lineWidth = 1;
  for (let i = 1; i < rowCount(); i++) {
    const y = Math.round((H * i) / rowCount()) + 0.5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawBeam() {
  const x = phase * W;
  const g = ctx.createLinearGradient(x - 60, 0, x + 2, 0);
  g.addColorStop(0, 'rgba(170,210,255,0)');
  g.addColorStop(0.85, 'rgba(170,210,255,0.12)');
  g.addColorStop(1, 'rgba(225,240,255,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(x - 60, 0, 62, H);
}

function drawFlower(f) {
  const hue = hueOf(f);
  const lightness = 50 + (1 - f.y) * 18;   // higher notes glow a little brighter
  const r = FLOWER_RADIUS * (1 + f.glow * 0.7);
  ctx.save();
  ctx.translate(f.x * W, f.y * H);
  ctx.globalAlpha = f.leaving ? 0.3 : 1;
  const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 3);
  halo.addColorStop(0, `hsla(${hue},90%,70%,${0.2 + f.glow * 0.5})`);
  halo.addColorStop(1, `hsla(${hue},90%,60%,0)`);
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, 0, r * 3, 0, TAU);
  ctx.fill();
  ctx.rotate(f.spin);
  ctx.fillStyle = `hsl(${hue},85%,${lightness + f.glow * 20}%)`;
  for (let i = 0; i < f.petals; i++) {
    ctx.rotate(TAU / f.petals);
    ctx.beginPath();
    ctx.ellipse(r * 0.6, 0, r * 0.62, r * 0.3, 0, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = `hsl(${(hue + 40) % 360},100%,${80 + f.glow * 15}%)`;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.28, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawSparkles() {
  for (const s of sparkles) {
    ctx.fillStyle = `hsla(${s.hue},100%,80%,${s.life})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.8 * s.life + 0.4, 0, TAU);
    ctx.fill();
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running) advance(dt);
  update(dt);
  drawSky(now);
  drawBeam();
  flowers.forEach(drawFlower);
  drawSparkles();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const isOutside = (px, py) => px < EDGE_MARGIN || py < EDGE_MARGIN || px > W - EDGE_MARGIN || py > H - EDGE_MARGIN;

canvas.addEventListener('pointerdown', (e) => {
  if (e.button === 2) return;
  ensureAudio();
  hideHint();
  const hit = flowerAt(e.clientX, e.clientY);
  if (hit) {
    drag = { flower: hit, moved: false };
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
    return;
  }
  if (flowers.length >= MAX_FLOWERS) return;
  const f = makeFlower(e.clientX / W, snapY(e.clientY / H));
  flowers = [...flowers, f];
  trigger(f);
  save();
});

canvas.addEventListener('pointermove', (e) => {
  if (!drag) {
    canvas.style.cursor = flowerAt(e.clientX, e.clientY) ? 'grab' : 'crosshair';
    return;
  }
  const f = drag.flower;
  f.x = e.clientX / W;
  f.y = e.clientY / H;
  f.leaving = isOutside(e.clientX, e.clientY);
  drag.moved = true;
});

function endDrag() {
  if (!drag) return;
  const f = drag.flower;
  if (f.leaving) {
    removeFlower(f);
  } else if (drag.moved) {
    f.x = clamp(f.x, 0, 1);
    f.y = snapY(f.y);
    trigger(f);
  }
  drag = null;
  canvas.style.cursor = 'crosshair';
  save();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const hit = flowerAt(e.clientX, e.clientY);
  if (hit) { removeFlower(hit); save(); }
});

/* ---------- HUD ---------- */
const playBtn = document.getElementById('play');
const loopInput = document.getElementById('loop');
const loopOut = document.getElementById('loopOut');
const scaleSelect = document.getElementById('scale');
const instrumentBar = document.getElementById('instruments');

function setRunning(next) {
  running = next;
  playBtn.textContent = running ? '⏸ Pause' : '▶ Play';
}

function selectInstrument(name, { preview = false } = {}) {
  currentInstrument = name;
  instrumentBar.querySelectorAll('button').forEach((btn) => {
    btn.setAttribute('aria-pressed', String(btn.dataset.instrument === name));
  });
  if (preview) {
    ensureAudio();
    playNote({ x: 0.5, y: 0.5, instrument: name });
  }
  save();
}

INSTRUMENT_NAMES.forEach((name, i) => {
  const { label, hue } = INSTRUMENTS[name];
  const btn = document.createElement('button');
  const dot = document.createElement('span');
  btn.className = 'inst';
  btn.dataset.instrument = name;
  btn.title = `${label} (${i + 1})`;
  btn.style.setProperty('--c', `hsl(${hue},85%,65%)`);
  dot.className = 'dot';
  btn.append(dot, label);
  btn.addEventListener('click', () => selectInstrument(name, { preview: true }));
  instrumentBar.append(btn);
});

playBtn.addEventListener('click', () => { ensureAudio(); setRunning(!running); });

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.repeat) return;
  const numbered = INSTRUMENT_NAMES[Number(e.key) - 1];
  if (numbered) {
    selectInstrument(numbered, { preview: true });
    return;
  }
  if (e.code !== 'Space') return;
  e.preventDefault();
  ensureAudio();
  setRunning(!running);
});

loopInput.addEventListener('input', () => {
  loopSeconds = Number(loopInput.value);
  loopOut.textContent = `${loopSeconds}s`;
  save();
});

Object.keys(SCALES).forEach((name) => scaleSelect.add(new Option(name, name)));
scaleSelect.addEventListener('change', () => {
  scaleName = scaleSelect.value;
  flowers.forEach((f) => { f.y = snapY(f.y); });
  save();
});

document.getElementById('surprise').addEventListener('click', () => {
  ensureAudio();
  hideHint();
  const room = Math.min(SURPRISE_COUNT, MAX_FLOWERS - flowers.length);
  const fresh = Array.from({ length: room }, () =>
    makeFlower(0.05 + Math.random() * 0.9, snapY(0.1 + Math.random() * 0.7), randomInstrument()));
  flowers = [...flowers, ...fresh];
  fresh.forEach((f) => burst(f, 8));
  save();
});

document.getElementById('clear').addEventListener('click', () => {
  flowers.forEach((f) => burst(f, 6, true));
  flowers = [];
  save();
});

/* ---------- boot ---------- */
load();
loopInput.value = loopSeconds;
loopOut.textContent = `${loopSeconds}s`;
scaleSelect.value = scaleName;
selectInstrument(currentInstrument);
if (flowers.length) {
  document.getElementById('hintText').textContent = 'Welcome back — click anywhere to wake your garden.';
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
