<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Garden</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="garden" aria-label="Garden: click to plant flowers"></canvas>

<header class="topbar" id="topbar">
  <div class="brand"><span aria-hidden="true">🌙</span><span class="brand-name">Sound Garden</span></div>
  <nav class="tabs" aria-label="Gardens">
    <div class="tab-list" id="tabList" role="tablist" aria-label="Gardens"></div>
    <button class="icon-btn" id="addGarden" aria-label="Add garden">＋</button>
  </nav>
  <div class="topbar-actions">
    <select id="recordLoops" aria-label="How many loops to record"></select>
    <button id="record" class="rec-btn" aria-label="Record" title="Record (R) · Esc to stop">
      <span aria-hidden="true">⏺</span><span class="rec-label">Record</span>
    </button>
  </div>
</header>

<div class="pane-chip" id="paneChip" role="group" aria-label="Active garden">
  <span id="paneChipName">Garden 1</span>
  <button id="surprise" title="Plant random flowers in this garden">✨ Surprise</button>
  <button id="clear" title="Remove every flower in this garden">Clear</button>
</div>

<div class="hint" id="hint">
  <h1>Sound Garden</h1>
  <p id="hintText">Pick an instrument below (or press 1–4), then click to plant it.<br>
  Higher flowers sing higher notes, and the moonbeam plays your garden on a loop.<br>
  Press ＋ at the top to add a garden that plays alongside this one.</p>
</div>

<footer class="dock" id="dock">
  <div class="menu" id="instrumentMenu">
    <button class="menu-button" id="instrumentButton" aria-haspopup="listbox" aria-expanded="false"
      aria-controls="instrumentList" title="Instrument (1–4)">
      <span class="dot" aria-hidden="true"></span><span id="instrumentLabel">Bell</span><span class="caret" aria-hidden="true">▾</span>
    </button>
    <ul class="menu-list" id="instrumentList" role="listbox" aria-label="Instrument" hidden></ul>
  </div>
  <span class="divider" aria-hidden="true"></span>
  <button class="play-btn" id="play" aria-label="Pause" title="Pause (Space)">⏸</button>
  <label>Loop <input id="loop" type="range" min="4" max="16" step="1" value="8"><output id="loopOut">8s</output></label>
  <label>Scale <select id="scale"></select></label>
  <span class="divider" aria-hidden="true"></span>
  <label title="Volume (speakers only — recordings stay full level)">
    <span id="volumeIcon" aria-hidden="true">🔊</span>
    <input id="volume" type="range" min="0" max="100" step="1" value="80" aria-label="Volume">
    <output id="volumeOut">80%</output>
  </label>
</footer>

<div class="countdown" id="countdown" hidden aria-live="assertive">
  <b id="countdownNum">3</b>
  <span id="countdownInfo"></span>
</div>

<div class="result" id="result" hidden role="dialog" aria-label="Your recording">
  <h2>Your recording</h2>
  <video id="resultVideo" controls loop playsinline></video>
  <div class="result-actions">
    <button id="closeResult">Close</button>
    <a id="download" class="btn primary" download>⬇ Download</a>
  </div>
</div>

<div class="toast" id="toast" hidden role="status">
  <span id="toastText"></span>
  <button id="toastAction" hidden></button>
</div>

<script src="js/audio.js"></script>
<script src="js/garden.js"></script>
<script src="js/draw.js"></script>
<script src="js/recording.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
